<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Seguranca Web - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/style/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill mb-2">
                                🛡️ Lab Security
                            </span>
                            <h2 class="fw-bold text-dark mt-2">Acesso ao Sistema</h2>
                        </div>

                        <div id="alert-container"></div>

                        <form action="src/Controle/UserControle.php" method="POST" id="form-login" novalidate>
                            
                            <!-- Campo Usuário / Email -->
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold">Usuário ou E-mail</label>
                                <input 
                                    type="text" 
                                    class="form-control form-control-lg" 
                                    id="usuario" 
                                    name="usuario" 
                                    placeholder="Ex: admin ou usuario@exemplo.com"
                                    autocomplete="off"
                                    required
                                >
                            </div>

                            <!-- Campo Senha -->
                            <div class="mb-4">
                                <label for="senha" class="form-label fw-semibold">Senha</label>
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg" 
                                    id="senha" 
                                    name="senha" 
                                    placeholder="Digite a sua senha"
                                    required
                                >
                            </div>

                            <!-- Ação de Envio -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm">
                                Entrar no Sistema
                            </button>

                        </form>

                    </div>
                    
                    <div class="card-footer bg-body-tertiary text-center py-3 border-0 rounded-bottom-4">
                        <small class="text-muted">
                            Destino pós-validação: <strong>painel.php</strong>
                        </small>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="public/js/js.js"></script>
</body>
</html>
